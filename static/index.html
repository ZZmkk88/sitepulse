<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sitepulse · 网站监控台</title>
<style>
  :root{
    --bg:#0d1520; --panel:#152233; --panel2:#1a2a40; --line:#243650;
    --txt:#dbe6f3; --dim:#8ba3bd; --teal:#2dd4bf; --red:#f87171; --gray:#64748b;
    --amber:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt)}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .logo{font-size:20px;font-weight:700;letter-spacing:.5px}
  .logo .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--teal);margin-right:8px;box-shadow:0 0 10px var(--teal)}
  header .spacer{flex:1}
  header span.user{color:var(--dim);font-size:14px}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:14px}
  button:hover{border-color:var(--teal)}
  button.primary{background:var(--teal);color:#06281f;border-color:var(--teal);font-weight:600}
  button.danger:hover{border-color:var(--red);color:var(--red)}
  button:disabled{opacity:.5;cursor:wait}
  main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  .strip{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .stat{flex:1;min-width:130px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat b{font-size:26px;display:block}
  .stat span{color:var(--dim);font-size:13px}
  .addbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:18px}
  .addbar form{display:flex;gap:10px;flex-wrap:wrap}
  input,select{background:#0b1220;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px}
  input:focus{outline:none;border-color:var(--teal)}
  .addbar input[name=name]{width:180px}
  .addbar input[name=url]{flex:1;min-width:260px}
  .addbar input[name=interval]{width:130px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card.off{opacity:.55}
  .card .top{display:flex;align-items:flex-start;gap:10px}
  .card h3{margin:0;font-size:17px;word-break:break-all}
  .card .url{color:var(--dim);font-size:12.5px;word-break:break-all;margin-top:2px}
  .pill{margin-left:auto;flex:none;font-size:13px;font-weight:700;padding:4px 12px;border-radius:99px}
  .pill.up{background:rgba(45,212,191,.15);color:var(--teal)}
  .pill.down{background:rgba(248,113,113,.15);color:var(--red)}
  .pill.unknown{background:rgba(100,116,139,.2);color:var(--dim)}
  .nums{display:flex;gap:18px;margin:14px 0 6px}
  .nums div b{font-size:19px;display:block}
  .nums div span{color:var(--dim);font-size:12px}
  .err{color:var(--red);font-size:12.5px;min-height:16px;word-break:break-all}
  .ops{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .ops button{font-size:13px;padding:5px 10px}
  #history{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:none}
  #history h3{margin:0 0 10px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500}
  .login-wrap{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
  .login-wrap h1{font-size:22px;margin:0 0 6px}
  .login-wrap p{color:var(--dim);font-size:13.5px;margin:0 0 18px}
  .login-wrap input{width:100%;margin-bottom:12px}
  .login-wrap button{width:100%}
  .msg{color:var(--red);font-size:13.5px;min-height:18px;margin-top:8px}
  .warn{background:rgba(251,191,36,.12);border:1px solid var(--amber);color:var(--amber);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px;display:none}
  dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(420px,92vw)}
  dialog input{width:100%;margin-bottom:10px}
  .muted{color:var(--dim);font-size:13px}
  a{color:var(--teal)}
</style>
</head>
<body>

<div id="loginView" style="display:none">
  <div class="login-wrap">
    <h1><span style="color:var(--teal)">●</span> sitepulse</h1>
    <p>网站监控台 · 登录后管理你的监控项</p>
    <form id="loginForm">
      <input name="username" placeholder="用户名" autocomplete="username" required>
      <input name="password" type="password" placeholder="密码" autocomplete="current-password" required>
      <button class="primary" type="submit">登录</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>
</div>

<div id="appView" style="display:none">
  <header>
    <div class="logo"><span class="dot"></span>sitepulse</div>
    <span class="muted">网站监控台</span>
    <div class="spacer"></div>
    <a href="/status" target="_blank">公开状态页 ↗</a>
    <span class="user" id="whoami"></span>
    <button id="pwBtn">改密码</button>
    <button id="logoutBtn">退出</button>
  </header>
  <main>
    <div class="warn" id="pwWarn">你正在使用初始密码，请尽快点击右上角「改密码」修改。</div>
    <div class="strip">
      <div class="stat"><b id="stTotal">0</b><span>监控项</span></div>
      <div class="stat"><b id="stUp" style="color:var(--teal)">0</b><span>当前畅通</span></div>
      <div class="stat"><b id="stDown" style="color:var(--red)">0</b><span>当前中断</span></div>
      <div class="stat"><b id="stAvg">—</b><span>平均可用率（24h）</span></div>
    </div>

    <div class="addbar">
      <form id="addForm">
        <input name="name" placeholder="名称，如：公司官网" required maxlength="150">
        <input name="url" placeholder="网址，如：https://example.com" required>
        <input name="interval" type="number" min="5" max="86400" value="60" title="探测间隔（秒）">
        <button class="primary" type="submit">＋ 添加监控</button>
      </form>
      <div class="msg" id="addMsg"></div>
    </div>

    <div class="grid" id="cards"></div>

    <section id="history">
      <h3 id="histTitle">探测历史</h3>
      <table>
        <thead><tr><th>时间</th><th>结果</th><th>状态码</th><th>响应</th><th>失败原因</th></tr></thead>
        <tbody id="histBody"></tbody>
      </table>
    </section>
  </main>
</div>

<dialog id="editDlg">
  <h3 style="margin-top:0">编辑监控项</h3>
  <form id="editForm" method="dialog">
    <input name="name" placeholder="名称" required maxlength="150">
    <input name="url" placeholder="网址" required>
    <input name="interval" type="number" min="5" max="86400" placeholder="间隔秒数">
    <div class="msg" id="editMsg"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button type="button" id="editCancel">取消</button>
      <button class="primary" type="submit">保存</button>
    </div>
  </form>
</dialog>

<dialog id="pwDlg">
  <h3 style="margin-top:0">修改密码</h3>
  <form id="pwForm" method="dialog">
    <input name="old" type="password" placeholder="旧密码" required>
    <input name="new" type="password" placeholder="新密码（至少 6 位）" required>
    <div class="msg" id="pwMsg"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button type="button" id="pwCancel">取消</button>
      <button class="primary" type="submit">确认修改</button>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
let token = localStorage.getItem("sp_token") || "";
let editingId = null;

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: {"Content-Type": "application/json", "Authorization": "Bearer " + token, ...(opts.headers || {})}
  });
  if (r.status === 401 && token) { logout(); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ("请求失败 " + r.status));
  return data;
}
function fmtTime(s) { return s ? s.replace("T", " ").replace("+00:00", " UTC") : "—"; }
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function showLogin() { $("#loginView").style.display = "block"; $("#appView").style.display = "none"; }
function showApp() { $("#loginView").style.display = "none"; $("#appView").style.display = "block"; }
function logout() { token = ""; localStorage.removeItem("sp_token"); showLogin(); }

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: f.get("username"), password: f.get("password")})});
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || "登录失败");
    token = data.token; localStorage.setItem("sp_token", token);
    $("#whoami").textContent = data.username;
    $("#pwWarn").style.display = data.must_change_password ? "block" : "none";
    showApp(); refresh();
  } catch (err) { $("#loginMsg").textContent = err.message; }
});
$("#logoutBtn").addEventListener("click", async () => {
  try { await api("/api/logout", {method: "POST"}); } catch (e) {}
  logout();
});

$("#addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  $("#addMsg").textContent = "";
  try {
    await api("/api/monitors", {method: "POST", body: JSON.stringify({
      name: f.get("name"), url: f.get("url"), interval_seconds: Number(f.get("interval"))})});
    e.target.reset(); e.target.interval.value = 60; refresh();
  } catch (err) { $("#addMsg").textContent = err.message; }
});

async function refresh() {
  if (!token) return;
  let list;
  try { list = await api("/api/monitors"); } catch (e) { return; }
  const act = list.filter(m => m.active);
  $("#stTotal").textContent = list.length;
  $("#stUp").textContent = act.filter(m => m.latest && m.latest.status === 1).length;
  $("#stDown").textContent = act.filter(m => m.latest && m.latest.status === 0).length;
  const ups = act.map(m => m.uptime_24h).filter(v => v !== null);
  $("#stAvg").textContent = ups.length ? (ups.reduce((a, b) => a + b, 0) / ups.length).toFixed(1) + "%" : "—";
  const box = $("#cards"); box.innerHTML = "";
  for (const m of list) {
    const st = !m.latest ? "unknown" : (m.latest.status === 1 ? "up" : "down");
    const stTxt = !m.latest ? "未探测" : (m.latest.status === 1 ? "● 通" : "● 断");
    const card = document.createElement("div");
    card.className = "card" + (m.active ? "" : " off");
    card.innerHTML = `
      <div class="top"><div>
        <h3>${esc(m.name)}</h3><div class="url">${esc(m.url)}</div>
      </div><span class="pill ${st}">${stTxt}</span></div>
      <div class="nums">
        <div><b>${m.latest && m.latest.response_ms !== null ? m.latest.response_ms + " ms" : "—"}</b><span>最近响应</span></div>
        <div><b>${m.uptime_24h !== null ? m.uptime_24h + "%" : "—"}</b><span>24h 可用率</span></div>
        <div><b>${m.interval_seconds}s</b><span>探测间隔</span></div>
      </div>
      <div class="err">${m.latest && m.latest.error ? esc(m.latest.error) : ""}</div>
      <div class="muted">最近探测：${fmtTime(m.latest && m.latest.checked_at)}${m.active ? "" : " · 已暂停"}</div>
      <div class="ops">
        <button data-act="check">立即探测</button>
        <button data-act="hist">历史</button>
        <button data-act="toggle">${m.active ? "暂停" : "启用"}</button>
        <button data-act="edit">编辑</button>
        <button data-act="del" class="danger">删除</button>
      </div>`;
    card.querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => onCardAction(b.dataset.act, m, b)));
    box.appendChild(card);
  }
}

async function onCardAction(act, m, btn) {
  try {
    if (act === "check") {
      btn.disabled = true; btn.textContent = "探测中…";
      await api(`/api/monitors/${m.id}/check`, {method: "POST"});
      refresh();
    } else if (act === "toggle") {
      await api(`/api/monitors/${m.id}/active`, {method: "POST", body: JSON.stringify({active: !m.active})});
      refresh();
    } else if (act === "del") {
      if (confirm(`删除监控项「${m.name}」及其全部历史记录？`)) {
        await api(`/api/monitors/${m.id}`, {method: "DELETE"}); refresh();
      }
    } else if (act === "edit") {
      editingId = m.id;
      const f = $("#editForm");
      f.name.value = m.name; f.url.value = m.url; f.interval.value = m.interval_seconds;
      $("#editMsg").textContent = ""; $("#editDlg").showModal();
    } else if (act === "hist") {
      const rows = await api(`/api/monitors/${m.id}/checks?limit=50`);
      $("#histTitle").textContent = `探测历史 · ${m.name}`;
      $("#histBody").innerHTML = rows.map(c => `<tr>
        <td>${fmtTime(c.checked_at)}</td>
        <td>${c.status === 1 ? '<span style="color:var(--teal)">通</span>' : '<span style="color:var(--red)">断</span>'}</td>
        <td>${c.status_code ?? "—"}</td>
        <td>${c.response_ms !== null ? c.response_ms + " ms" : "—"}</td>
        <td>${esc(c.error || "")}</td></tr>`).join("") || '<tr><td colspan="5" class="muted">暂无记录</td></tr>';
      const h = $("#history"); h.style.display = "block"; h.scrollIntoView({behavior: "smooth"});
    }
  } catch (err) { alert(err.message); }
  finally { if (btn) { btn.disabled = false; if (act === "check") btn.textContent = "立即探测"; } }
}

$("#editCancel").addEventListener("click", () => $("#editDlg").close());
$("#editForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    await api(`/api/monitors/${editingId}`, {method: "PUT", body: JSON.stringify({
      name: f.get("name"), url: f.get("url"), interval_seconds: Number(f.get("interval"))})});
    $("#editDlg").close(); refresh();
  } catch (err) { $("#editMsg").textContent = err.message; }
});

$("#pwBtn").addEventListener("click", () => { $("#pwMsg").textContent = ""; $("#pwDlg").showModal(); });
$("#pwCancel").addEventListener("click", () => $("#pwDlg").close());
$("#pwForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    await api("/api/change-password", {method: "POST", body: JSON.stringify({
      old_password: f.get("old"), new_password: f.get("new")})});
    $("#pwDlg").close(); $("#pwWarn").style.display = "none"; alert("密码已修改");
  } catch (err) { $("#pwMsg").textContent = err.message; }
});

(async () => {
  if (!token) { showLogin(); return; }
  try {
    const me = await api("/api/me");
    $("#whoami").textContent = me.username;
    $("#pwWarn").style.display = me.must_change_password ? "block" : "none";
    showApp(); refresh();
  } catch (e) { showLogin(); }
})();
setInterval(refresh, 15000);
</script>
</body>
</html>
